[project]
name = "pathsnap"
version = "0.1.0"
description = "PathSnap: GPS map-matching candidate-arc classifier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "pyarrow",
    "joblib",
    "matplotlib",
    "folium",
    "torch>=2.15.0",
    "xgboost>=3.4.1",
    "shapely>=2.2.0",
    "optuna>=5.1.0",
    "nbformat>=5.11.1",
    "nbconvert>=7.17.2",
    "ipykernel>=7.4.0",
    "seaborn>=0.13.2",
    "fastapi>=0.163.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
